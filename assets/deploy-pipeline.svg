<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="BRIHA deployment pipeline: Code, CI tests, Docker build, deploy to Vercel and Docker hosts, live">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#010102"/><stop offset="1" stop-color="#010102"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FD8F32"/><stop offset=".5" stop-color="#7022FC"/><stop offset="1" stop-color="#FD8F32"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .box { fill: #010102; stroke-width: 1.6; }
      .ic  { font: 26px 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif; }
      .t   { font: 800 15px 'Segoe UI', Arial, sans-serif; fill: #FD8F32; }
      .s   { font: 500 11.5px 'Consolas', 'Fira Code', monospace; fill: #FD8F32; }
      .hd  { font: 700 12px 'Consolas', monospace; letter-spacing: 3px; fill: #FD8F32; }
      .ok  { animation: ok 6s ease-in-out infinite; }
      @keyframes ok { 0%,70% { opacity: .25; } 80%,100% { opacity: 1; } }
    </style>
    <path id="track" d="M130 128 H1070"/>
  </defs>
  <rect width="1200" height="230" rx="20" fill="url(#bg)"/>
  <text x="600" y="34" text-anchor="middle" class="hd">◆ BRIHA SHIP PIPELINE: IDEA TO PRODUCTION ◆</text>

  <use href="#track" stroke="url(#line)" stroke-width="3" opacity=".5"/>
  <circle r="7" fill="#FD8F32" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#track"/></animateMotion></circle>
  <circle r="5" fill="#FD8F32" filter="url(#glow)"><animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#track"/></animateMotion></circle>
  <circle r="5" fill="#FD8F32" filter="url(#glow)"><animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath href="#track"/></animateMotion></circle>

  <g>
    <rect class="box" x="60" y="70" width="150" height="116" rx="14" stroke="#FD8F32"/>
    <text x="135" y="106" text-anchor="middle" class="ic" style="font:900 24px Consolas,monospace;fill:#FD8F32">01</text>
    <text x="135" y="138" text-anchor="middle" class="t">Code</text>
    <text x="135" y="158" text-anchor="middle" class="s">Python · TS · Git</text>
  </g>
  <g>
    <rect class="box" x="290" y="70" width="150" height="116" rx="14" stroke="#7022FC"/>
    <text x="365" y="106" text-anchor="middle" class="ic" style="font:900 24px Consolas,monospace;fill:#FD8F32">02</text>
    <text x="365" y="138" text-anchor="middle" class="t">Test &amp; CI</text>
    <text x="365" y="158" text-anchor="middle" class="s">pytest · GitHub Actions</text>
  </g>
  <g>
    <rect class="box" x="520" y="70" width="160" height="116" rx="14" stroke="#FD8F32"/>
    <text x="600" y="106" text-anchor="middle" class="ic" style="font:900 24px Consolas,monospace;fill:#FD8F32">03</text>
    <text x="600" y="138" text-anchor="middle" class="t">Containerize</text>
    <text x="600" y="158" text-anchor="middle" class="s">Docker · Compose</text>
  </g>
  <g>
    <rect class="box" x="760" y="70" width="160" height="116" rx="14" stroke="#FD8F32"/>
    <text x="840" y="106" text-anchor="middle" class="ic" style="font:900 24px Consolas,monospace;fill:#FD8F32">04</text>
    <text x="840" y="138" text-anchor="middle" class="t">Deploy</text>
    <text x="840" y="158" text-anchor="middle" class="s">Vercel · Docker host</text>
  </g>
  <g>
    <rect class="box" x="1000" y="70" width="140" height="116" rx="14" stroke="#FD8F32"/>
    <text x="1070" y="106" text-anchor="middle" class="ic" style="font:900 24px Consolas,monospace;fill:#FD8F32">05</text>
    <text x="1070" y="138" text-anchor="middle" class="t">Live</text>
    <text x="1070" y="158" text-anchor="middle" class="s ok" style="fill:#FD8F32">● online</text>
  </g>
</svg>
