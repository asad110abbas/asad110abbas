<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="BRIHA in numbers: 26+ projects, 7 languages, 3 flagship AI apps, Vercel and Docker">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FD8F32"/><stop offset=".5" stop-color="#7022FC"/><stop offset="1" stop-color="#F4F2FA"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .c { fill: #08080C; stroke: #1E1B2A; stroke-width: 1.4; }
      .n { font: 900 46px 'Segoe UI Black','Arial Black','Segoe UI',Arial,sans-serif; fill: url(#g); }
      .l { font: 700 13px 'Consolas','Fira Code',monospace; fill: #B8B3C6; letter-spacing: 2px; }
      .pop { animation: pop 1s cubic-bezier(.2,1.4,.4,1) both; transform-box: fill-box; transform-origin: center; }
      .glow { animation: glow 3s ease-in-out infinite; }
      @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
      @keyframes glow { 0%,100% { stroke: #1E1B2A; } 50% { stroke: #7022FC; } }
    </style>
  </defs>
  <g>
    <rect class="c glow" x="10" y="10" width="280" height="130" rx="18"/>
    <text class="n pop" x="150" y="80" text-anchor="middle">26+</text>
    <text class="l" x="150" y="112" text-anchor="middle">PROJECTS IN BRIHA</text>
  </g>
  <g>
    <rect class="c glow" x="310" y="10" width="280" height="130" rx="18" style="animation-delay:-.75s"/>
    <text class="n pop" x="450" y="80" text-anchor="middle" style="animation-delay:.2s">7</text>
    <text class="l" x="450" y="112" text-anchor="middle">LANGUAGES</text>
  </g>
  <g>
    <rect class="c glow" x="610" y="10" width="280" height="130" rx="18" style="animation-delay:-1.5s"/>
    <text class="n pop" x="750" y="80" text-anchor="middle" style="animation-delay:.4s">3</text>
    <text class="l" x="750" y="112" text-anchor="middle">SYSTEMS IN THE AI HUB</text>
  </g>
  <g>
    <rect class="c glow" x="910" y="10" width="280" height="130" rx="18" style="animation-delay:-2.25s"/>
    <text class="n pop" x="1050" y="80" text-anchor="middle" style="animation-delay:.6s;font-size:36px">CLOUD</text>
    <text class="l" x="1050" y="112" text-anchor="middle">VERCEL · DOCKER</text>
  </g>
</svg>
