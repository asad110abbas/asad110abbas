<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Part of BRIHA: Chatbot, Voice, Research, Data Lab, Engineering and Cloud around the BRIHA core">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/><stop offset="0.6" stop-color="#0B0B10"/><stop offset="1" stop-color="#0E0A16"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF2E97"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".3" stop-color="#7CF7FF"/>
      <stop offset=".7" stop-color="#8B5CF6" stop-opacity=".9"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".5"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="20" r="1" fill="#fff" opacity=".5"/><circle cx="70" cy="90" r=".8" fill="#fff" opacity=".35"/>
      <circle cx="100" cy="40" r="1.2" fill="#7CF7FF" opacity=".4"/><circle cx="40" cy="110" r=".7" fill="#FF6BB5" opacity=".4"/>
    </pattern>
    <style>
      .t  { font: 800 17px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .s  { font: 500 12.5px 'Consolas', 'Fira Code', monospace; fill: #AEB8D6; }
      .k  { font: 700 11px 'Consolas', monospace; letter-spacing: 2px; }
      .beam { fill: none; stroke-width: 2; stroke-dasharray: 3 9; animation: flow 1.6s linear infinite; }
      .card { fill: #0B0B10; fill-opacity: .92; stroke-width: 1.6; }
      .orbit { fill: none; stroke: #2A3566; stroke-width: 1; stroke-dasharray: 2 6; transform-origin: 600px 300px; animation: spin 40s linear infinite; }
      .twinkle { animation: tw 4s ease-in-out infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes tw { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <rect width="1200" height="600" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="600" rx="22" fill="url(#stars)" class="twinkle"/>

  <text x="600" y="44" text-anchor="middle" class="k" style="fill:#7CF7FF;font-size:13px">◆ PART OF BRIHA ◆</text>

  <!-- orbits -->
  <circle class="orbit" cx="600" cy="300" r="150"/>
  <circle class="orbit" cx="600" cy="300" r="230" style="animation-direction:reverse;animation-duration:60s"/>

  <!-- beams core ->modules -->
  <path class="beam" d="M600 300 L300 150" stroke="#00F0FF"/>
  <path class="beam" d="M600 300 L900 150" stroke="#FF2E97" style="animation-delay:-.4s"/>
  <path class="beam" d="M600 300 L600 110" stroke="#B794FF" style="animation-delay:-.8s"/>
  <path class="beam" d="M600 300 L270 440" stroke="#FF2E97" style="animation-delay:-1.2s"/>
  <path class="beam" d="M600 300 L930 440" stroke="#00F0FF" style="animation-delay:-.2s"/>
  <path class="beam" d="M600 300 L600 500" stroke="#B794FF" style="animation-delay:-.6s"/>

  <!-- core -->
  <circle cx="600" cy="300" r="110" fill="url(#halo)"><animate attributeName="r" values="95;120;95" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="300" r="74" fill="none" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="56" fill="url(#core)" filter="url(#glow)"><animate attributeName="r" values="52;60;52" dur="2.6s" repeatCount="indefinite"/></circle>
  <text x="600" y="298" text-anchor="middle" style="font:900 22px 'Segoe UI Black','Arial Black',sans-serif;letter-spacing:4px;fill:#0B0B10">BRIHA</text>
  <text x="600" y="318" text-anchor="middle" class="k" style="fill:#0E0A16;font-size:10px">AGI CORE</text>

  <!-- module: Research (top) -->
  <g class="float">
    <rect class="card" x="485" y="62" width="230" height="74" rx="14" stroke="#B794FF"/>
    <text x="600" y="88" text-anchor="middle" class="t">Briha Research</text>
    <text x="600" y="108" text-anchor="middle" class="s">RAG · SEO Agents · OCR · NLP</text>
    <text x="600" y="125" text-anchor="middle" class="s">Web &amp; Data Mining</text>
  </g>

  <!-- module: Chatbot (top-left) -->
  <g class="float" style="animation-delay:-1s">
    <rect class="card" x="140" y="108" width="270" height="84" rx="14" stroke="#00F0FF"/>
    <text x="275" y="136" text-anchor="middle" class="t">Briha AI Chatbot</text>
    <text x="275" y="156" text-anchor="middle" class="s">4-agent LLM · grounding guard</text>
    <text x="275" y="174" text-anchor="middle" class="s" style="fill:#7CF7FF">GPT-5 · Gemini · FastAPI · React</text>
  </g>

  <!-- module: Voice (top-right) -->
  <g class="float" style="animation-delay:-2s">
    <rect class="card" x="790" y="108" width="270" height="84" rx="14" stroke="#FF2E97"/>
    <text x="925" y="136" text-anchor="middle" class="t">Briha Voice Assistant</text>
    <text x="925" y="156" text-anchor="middle" class="s">Real-time bilingual voice AI</text>
    <text x="925" y="174" text-anchor="middle" class="s" style="fill:#FF9ACB">Gemini · RAG · WebSockets</text>
  </g>

  <!-- module: Data Lab (bottom-left) -->
  <g class="float" style="animation-delay:-3s">
    <rect class="card" x="110" y="396" width="300" height="100" rx="14" stroke="#FF2E97"/>
    <text x="260" y="424" text-anchor="middle" class="t">Briha Data Lab</text>
    <text x="260" y="444" text-anchor="middle" class="s">Power BI · DAX · SQL · R</text>
    <text x="260" y="462" text-anchor="middle" class="s">Forecasting · Churn ML · ETL</text>
    <text x="260" y="480" text-anchor="middle" class="s">Streamlit · Excel automation</text>
  </g>

  <!-- module: Cloud (bottom-right) -->
  <g class="float" style="animation-delay:-4s">
    <rect class="card" x="790" y="396" width="300" height="100" rx="14" stroke="#00F0FF"/>
    <text x="940" y="424" text-anchor="middle" class="t">Briha Cloud</text>
    <text x="940" y="444" text-anchor="middle" class="s">Docker · Docker Compose</text>
    <text x="940" y="462" text-anchor="middle" class="s">Vercel · Nginx · Linux VM</text>
    <text x="940" y="480" text-anchor="middle" class="s" style="fill:#7CF7FF">GitHub Actions CI/CD</text>
  </g>

  <!-- module: Engineering (bottom) -->
  <g class="float" style="animation-delay:-5s">
    <rect class="card" x="470" y="478" width="260" height="84" rx="14" stroke="#B794FF"/>
    <text x="600" y="506" text-anchor="middle" class="t">Briha Engineering</text>
    <text x="600" y="526" text-anchor="middle" class="s">TypeScript · React · Node</text>
    <text x="600" y="544" text-anchor="middle" class="s">Java Spring Boot · Go</text>
  </g>
</svg>
