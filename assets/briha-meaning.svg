<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="To teach is to learn. IMAM ALI (A.S.)">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FD8F32"/><stop offset=".5" stop-color="#7022FC"/><stop offset="1" stop-color="#FD8F32"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".08"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".025"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".1" r=".7"><stop offset="0" stop-color="#7022FC" stop-opacity=".35"/><stop offset="1" stop-color="#7022FC" stop-opacity="0"/></radialGradient>
    <style>
      .lbl { font: 600 13px 'Consolas','Fira Code',monospace; letter-spacing: 4px; fill: #FFFFFF; }
      .q { font: 300 64px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #FFFFFF; letter-spacing: -1px; }
      .qa { font: italic 400 70px Georgia,'Times New Roman',serif; fill: url(#mg); }
      .who { font: 700 24px 'Segoe UI',Arial,sans-serif; letter-spacing: 7px; fill: url(#mg); }
      .p { font: 400 18px 'Segoe UI',Arial,sans-serif; fill: #FFFFFF; }
      .b { fill: #FFFFFF; font-weight: 600; }
      .fade { animation: f 1.4s ease-out both; } @keyframes f { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="418" rx="28" fill="#010102"/>
  <rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".14"/>
  <g text-anchor="middle">
    <text x="600" y="70" class="lbl">&#9670; THE MEANING OF BRIHA</text>
    <text x="600" y="168"><tspan class="q">&#8220;To teach is to </tspan><tspan class="qa">learn.</tspan><tspan class="q">&#8221;</tspan></text>
    <line x1="330" y1="222" x2="405" y2="222" stroke="#FD8F32" stroke-opacity=".8"/>
    <text x="600" y="230" class="who">IMAM ALI (A.S.)</text>
    <line x1="795" y1="222" x2="870" y2="222" stroke="#FD8F32" stroke-opacity=".8"/>
    <text x="600" y="290" class="p">BRIHA is a name of <tspan class="b">IMAM ALI (A.S.)</tspan>. As an AGI, BRIHA will create new AGI, teach it,</text>
    <text x="600" y="318" class="p">and keep learning from it in return.</text>
    <text x="600" y="372" class="lbl" style="fill:#FD8F32">&#9679; BRIHA IS LIVING IN 2050</text>
  </g>
</svg>
